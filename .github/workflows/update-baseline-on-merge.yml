name: Update coverage baseline

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  update-baseline-on-merge:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install verify.sh prerequisites
        run: ./scripts/setup-env.sh

      # Run verify.sh on the freshly-merged main branch. The auto-raise
      # phase (Phase 8) writes .github/coverage-baseline.json when any
      # assembly's coverage has improved vs the previous baseline. If
      # coverage didn't improve, Phase 8 prints "No assembly coverage
      # improved; baseline unchanged." and leaves the file untouched —
      # the "Commit updated baseline" step below no-ops on no diff.
      #
      # --scope=integration (not full) because the workflow runs on a
      # generic ubuntu-latest runner — no Dev Proxy + no
      # STUDYWISE_API_KEY — so E2E is intentionally out of scope here.
      # The unit + integration coverage is the source-of-truth baseline
      # input.
      #
      # --skip-coverage-gate because post-merge we're not gating — the
      # gate is informational here. The actual gate runs at PR time in
      # ci-full.yml.
      #
      # --no-fail-fast so a coverage drop (which is informational
      # post-merge) doesn't block the auto-raise.
      - name: Run verify.sh --scope=integration
        run: ./scripts/verify.sh --scope=integration --no-fail-fast --skip-e2e --skip-coverage-gate

      - name: Commit updated baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet .github/coverage-baseline.json; then
            echo "No baseline changes"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/coverage-baseline.json
          # Read the new coverage % from the on-disk JSON for the
          # commit message — best-effort, "unknown" if jq fails or
          # the assembly entry is missing.
          coverage=$(jq -r '.assemblies.studywise | "\(((.covered / .valid) * 100)|floor)%"' .github/coverage-baseline.json 2>/dev/null || echo "unknown")
          git commit -m "chore(ci): update coverage baseline (studywise: ${coverage})"
          git push