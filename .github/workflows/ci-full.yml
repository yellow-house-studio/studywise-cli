name: CI Full

on:
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  docs-only-check:
    if: github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: docs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - running full CI"
          else
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

            if [ -z "$changed_files" ]; then
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            elif echo "$changed_files" | grep -qvE '(\.md$|docs/|\.txt$|\.cursor/skills/|\.opencode/skills/|\.codex/skills/)'; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-and-test:
    name: Build and quality checks (full)
    needs: [docs-only-check]
    if: >-
      (github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: needs.docs-only-check.outputs.docs_only != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Skip - docs only
        if: needs.docs-only-check.outputs.docs_only == 'true'
        run: echo "Skipping CI - only docs changed"

      - name: Setup .NET
        if: needs.docs-only-check.outputs.docs_only != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install verify.sh prerequisites
        if: needs.docs-only-check.outputs.docs_only != 'true'
        run: ./scripts/setup-env.sh

      # Single verify.sh invocation under --scope=full. The integration
      # tests build their own WireMock server in-process and never dial
      # the real Studywise API — no STUDYWISE_API_KEY secret, no Dev
      # Proxy, no `pull_request_review`-gated E2E phase. Coverage gate
      # + baseline auto-raise run as part of this single invocation.
      - name: Run verify.sh --scope=full
        if: needs.docs-only-check.outputs.docs_only != 'true'
        run: ./scripts/verify.sh --scope=full --no-fail-fast

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-full
          path: TestResults/Verify
          retention-days: 3
