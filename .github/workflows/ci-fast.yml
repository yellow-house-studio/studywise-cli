name: CI Fast

# PR-triggered fast gate. Mirrors studywise-api pr-gate-fast.yml: this
# workflow is the local mirror of scripts/verify.sh --scope=fast and
# nothing else. Format / analyzers / gitleaks / actionlint / cspell /
# security scan / unit + integration tests are all phases of the
# verify.sh invocation — no separate jobs so workflow-vs-script drift
# is impossible.
#
# --scope=fast is identical to --scope=full in the CLI repo today (no
# LongRunning tests exist; see verify.sh docstring and
# docs/testing/testing-strategy.md). The integration tests build a
# WireMock server in-process and never dial the real Studywise API, so
# no STUDYWISE_API_KEY secret is needed for this gate.
#
# Branch name: branches: [main] matches studywise-cli/main (this repo).
# studywise-api uses master; that's a repo difference, not a workflow
# design choice.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-and-test:
    name: Build and quality checks (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install verify.sh prerequisites
        # Installs gitleaks + actionlint (the two optional verify.sh
        # tooling the script auto-skips when missing). cspell runs
        # via npx — no separate install needed.
        run: ./scripts/setup-env.sh

      - name: Run verify.sh --scope=fast
        # `--scope=fast` is the verify.sh entry point that PR Fast
        # should always run. In the CLI repo today it is identical to
        # `--scope=full` (no LongRunning tests exist; see
        # docs/testing/testing-strategy.md). The integration tests
        # build a WireMock server in-process and never dial the real
        # Studywise API, so no STUDYWISE_API_KEY secret is required.
        #
        # `--no-fail-fast` collects all phase failures into one summary
        # (the fail-fast default would stop on the first broken phase
        # and hide later failures behind the same red check).
        run: ./scripts/verify.sh --scope=fast --no-fail-fast

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-fast
          path: TestResults/Verify
          retention-days: 3