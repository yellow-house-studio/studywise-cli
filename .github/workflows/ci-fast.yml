name: CI Fast

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIMENT: 1

jobs:
  build-and-test:
    name: Build and quality checks (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install verify.sh prerequisites
        run: ./scripts/setup-env.sh

      - name: Run verify.sh --scope=integration
        # `--scope=integration` runs every gate except coverage gate +
        # baseline auto-raise. PR Full Gate (ci-full.yml) handles those
        # on PR approval. The fast path catches format drift, analyzer
        # warnings, gitleaks leaks, actionlint errors, cspell misses,
        # vulnerable packages, unit + integration test failures —
        # without the cost of the full coverage merge + gate.
        #
        # `--no-fail-fast` collects all phase failures into one summary
        # (the fail-fast default would stop on the first broken phase).
        run: ./scripts/verify.sh --scope=integration --no-fail-fast

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-fast
          path: TestResults/Verify
          retention-days: 3