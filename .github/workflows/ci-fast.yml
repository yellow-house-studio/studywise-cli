name: CI Fast

# PR-triggered fast gate. Mirrors studywise-api pr-gate-fast.yml: this
# workflow is the local mirror of scripts/verify.sh --scope=fast and
# nothing else. Format / analyzers / gitleaks / actionlint / cspell /
# security scan / unit + integration + E2E tests are all phases of the
# verify.sh invocation — no separate jobs so workflow-vs-script drift
# is impossible.
#
# --scope=fast is identical to --scope=full in the CLI repo (xunit has
# no Fast/LongRunning attribute pattern, see verify.sh docstring).
# Running E2E on every PR is intentional: it's the single source of
# truth for "is this branch mergeable?" without waiting for a labelled
# request-full-ci run. STUDYWISE_API_KEY is REQUIRED — without it
# verify.sh's pre-flight exits 2 before any phase runs.
#
# Branch name: branches: [main] matches studywise-cli/main (this repo).
# studywise-api uses master; that's a repo difference, not a workflow
# design choice.

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-and-test:
    name: Build and quality checks (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install verify.sh prerequisites
        # Installs gitleaks + actionlint (the two optional verify.sh
        # tooling the script auto-skips when missing). cspell runs
        # via npx — no separate install needed.
        run: ./scripts/setup-env.sh

      - name: Copy Dev Proxy config
        # Dev Proxy stands in for the Studywise API during E2E tests.
        # The config files live under test/.devproxy/; the workflow
        # runs them from .devproxy/ at repo root per dev-proxy-tools/
        # actions/setup@v1 convention.
        run: |
          mkdir -p .devproxy
          cp test/.devproxy/devproxyrc.json .devproxy/
          cp test/.devproxy/studywise-health-mock.json .devproxy/

      - name: Setup Dev Proxy
        id: devproxy
        uses: dev-proxy-tools/actions/setup@v1
        with:
          config-file: .devproxy/devproxyrc.json
          auto-stop: true

      # STUDYWISE_API_KEY gates the E2E phase of verify.sh (--scope=fast
      # == full, which runs E2E). Pulled from the repo secret; passed
      # to the script via env so verify.sh's pre-flight picks it up.
      # STUDYWISE_API_BASE_URL points at the local Dev Proxy that the
      # previous step started — without that override the E2E tests
      # would hit the real Studywise API and fail with auth + scope
      # errors.
      - name: Run verify.sh --scope=fast
        env:
          STUDYWISE_API_KEY: ${{ secrets.STUDYWISE_API_KEY }}
          STUDYWISE_API_BASE_URL: ${{ steps.devproxy.outputs.proxy-url }}
        # --no-fail-fast collects all phase failures into one summary
        # (the fail-fast default would stop on the first broken phase
        # and hide later failures behind the same red check).
        run: ./scripts/verify.sh --scope=fast --no-fail-fast

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-fast
          path: TestResults/Verify
          retention-days: 3